name: LiveLLM Continuous Zero-Cost Benchmark

on:
  schedule:
    # Runs every 30 minutes, 24 hours a day (Zero Compute Cost via GitHub Free Runners)
    - cron: '*/30 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Live Benchmark Probe Cycle
        env:
          # Free tier API keys stored in GitHub Secrets (optional, works without them too)
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m livellm.scheduler.cron_probe

      - name: Commit & Push Updated Telemetry
        run: |
          git config --global user.name "LiveLLM Autonomous Observatory"
          git config --global user.email "observatory@livellm.ai"
          git add livellm/storage/livellm.db livellm/storage/catalog_cache.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "telemetry(cron): automated probe update [skip ci]" && git push)
