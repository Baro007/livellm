version: '3.8'

services:
  livellm:
    build: .
    container_name: livellm-observatory
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./livellm/storage:/app/livellm/storage
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
